name: "Update PR Target Branch"
run-name: "Update ${{ vars.BRANCH_PR_TARGET }}"

on:
  push:
    branches:
      - FrogPilot-Testing
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-pr-branch

env:
  BRANCH_PR_TARGET: ${{ vars.BRANCH_PR_TARGET }}
  GIT_EMAIL: ${{ vars.GIT_EMAIL }}
  GIT_NAME: ${{ vars.GIT_NAME }}
  SOURCE_BRANCH: FrogPilot-Testing

jobs:
  sync:
    if: vars.BRANCH_PR_TARGET != '' && vars.GIT_NAME != '' && vars.GIT_EMAIL != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - run: |
          set -euo pipefail
          export TZ="America/Phoenix"

          : "${BRANCH_PR_TARGET:?BRANCH_PR_TARGET is required}"
          : "${GIT_EMAIL:?GIT_EMAIL is required}"
          : "${GIT_NAME:?GIT_NAME is required}"
          [ "$SOURCE_BRANCH" != "$BRANCH_PR_TARGET" ] \
            || { echo "::error::BRANCH_PR_TARGET must differ from SOURCE_BRANCH"; exit 1; }

          git fetch --depth=5 origin \
            "+refs/heads/${SOURCE_BRANCH}:refs/remotes/origin/${SOURCE_BRANCH}"
          git fetch --depth=5 origin \
            "+refs/heads/${BRANCH_PR_TARGET}:refs/remotes/origin/${BRANCH_PR_TARGET}" || true

          source_ref="refs/remotes/origin/${SOURCE_BRANCH}"
          target_ref="refs/remotes/origin/${BRANCH_PR_TARGET}"

          compile_commit="$(
            git log --first-parent --format='%H%x09%s' "$source_ref" \
              | awk -F'\t' '$2 == "Compile FrogPilot" { print $1; exit }'
          )"
          [ -n "$compile_commit" ] \
            || { echo "::error::No \"Compile FrogPilot\" commit within the fetched history of ${SOURCE_BRANCH}"; exit 1; }

          source_tree="$(git rev-parse --verify "${compile_commit}~1^{tree}")"

          if target_tree="$(git rev-parse --verify --quiet "${target_ref}^{tree}")"; then
            if [ "$source_tree" = "$target_tree" ]; then
              echo "${BRANCH_PR_TARGET} is already up to date; nothing to publish."
              exit 0
            fi
          fi

          now="$(date +%s)"
          day="$(date -d "@${now}" +%-d)"
          case "$day" in
            1|21|31) suffix="st" ;;
            2|22)    suffix="nd" ;;
            3|23)    suffix="rd" ;;
            *)       suffix="th" ;;
          esac
          message="$(date -d "@${now}" "+%B ${day}${suffix}, %Y Update")"

          parent="$target_ref"
          if ! git rev-parse --verify --quiet "$target_ref" >/dev/null; then
            parent=""
          elif [ "$(git log -1 --format=%s "$target_ref")" = "$message" ]; then
            if git rev-parse --verify --quiet "${target_ref}^" >/dev/null; then
              parent="${target_ref}^"
            else
              parent=""
            fi
          fi

          if [ -n "$parent" ]; then
            commit="$(
              git -c "user.name=${GIT_NAME}" -c "user.email=${GIT_EMAIL}" \
                commit-tree "$source_tree" -p "$parent" -m "$message"
            )"
          else
            commit="$(
              git -c "user.name=${GIT_NAME}" -c "user.email=${GIT_EMAIL}" \
                commit-tree "$source_tree" -m "$message"
            )"
          fi

          git push --force-with-lease origin "${commit}:refs/heads/${BRANCH_PR_TARGET}"
